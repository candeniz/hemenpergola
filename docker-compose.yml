name: pergola

# Local development stack. Values here match .env.example line for line, so
# `docker compose up -d && pnpm dev` works with no further configuration.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: pergola-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pergola
      POSTGRES_PASSWORD: pergola
      POSTGRES_DB: pergola
      # C locale for the cluster: byte-order collation, which is what emails, slugs and
      # identifiers need. Turkish text that has to sort as a Turkish reader expects gets an
      # explicit per-column `COLLATE "tr-TR-x-icu"` instead — see 04-data-model.md
      # §Conventions for which columns and why the cluster is not tr_TR.
      #
      # This is only "the same as production" if production is created the same way.
      # 23-deployment-and-environments.md §Migrations records that as a requirement.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pergola -d pergola']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: pergola-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pergola
      MINIO_ROOT_PASSWORD: pergola-secret
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Creates the bucket so nobody has to click through the console. Runs once and exits;
  # `docker compose up -d` reports it as "exited (0)", which is success.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: pergola-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 pergola pergola-secret &&
      mc mb --ignore-existing local/pergola-local &&
      (mc anonymous set download local/pergola-local/public || true) &&
      mc ls local &&
      echo 'minio-init: bucket pergola-local ready'
      "
    restart: 'no'

volumes:
  postgres-data:
    name: pergola-postgres-data
  minio-data:
    name: pergola-minio-data
