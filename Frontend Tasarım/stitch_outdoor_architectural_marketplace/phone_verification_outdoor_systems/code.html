<script>
        // OTP Input Logic
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                if (e.target.value !== '') {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '') {
                    if (index > 0) {
                        inputs[index - 1].focus();
                    }
                }
            });
            
            // Allow pasting full code
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').slice(0, inputs.length).replace(/[^0-9]/g, '');
                for (let i = 0; i < pastedData.length; i++) {
                    if(inputs[i]) {
                        inputs[i].value = pastedData[i];
                        if(i < inputs.length -1) {
                            inputs[i+1].focus();
                        } else {
                            inputs[i].blur();
                        }
                    }
                }
            });
        });

        // Timer Logic
        let timeLeft = 30;
        const timerElement = document.getElementById('timer');
        const resendContainer = document.getElementById('resend-container');
        const resendBtn = document.getElementById('resend-btn');

        const countdown = setInterval(() => {
            timeLeft--;
            const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
            timerElement.textContent = `00:${seconds}`;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                resendContainer.classList.add('hidden');
                resendBtn.classList.remove('hidden');
            }
        }, 1000);

        resendBtn.addEventListener('click', () => {
            // Reset logic here (e.g., call API to resend)
            resendBtn.classList.add('hidden');
            resendContainer.classList.remove('hidden');
            timeLeft = 30;
            timerElement.textContent = `00:30`;
            // Restart interval (simplified for demo)
            setInterval(() => {
                if(timeLeft > 0) {
                    timeLeft--;
                    const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
                    timerElement.textContent = `00:${seconds}`;
                }
            }, 1000);
        });
        
        document.getElementById('otp-form').addEventListener('submit', (e) => {

        })
