<!-- Simple script to handle real-time calculation -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const widthInput = document.getElementById('width');
            const projectionInput = document.getElementById('projection');
            const areaDisplay = document.getElementById('calculated-area');
            const areaContext = document.querySelector('.pt-unit-sm .font-body-sm');

            function calculateArea() {
                const w = parseFloat(widthInput.value) || 0;
                const p = parseFloat(projectionInput.value) || 0;
                
                // Convert mm to m
                const wMeters = w / 1000;
                const pMeters = p / 1000;
                
                const area = wMeters * pMeters;
                
                areaDisplay.textContent = area.toFixed(1);
                areaContext.textContent = `Based on ${wMeters}m × ${pMeters}m base envelope`;
            }

            widthInput.addEventListener('input', calculateArea);
            projectionInput.addEventListener('input', calculateArea);
        });
    </script>
