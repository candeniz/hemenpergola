<style>
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        
        .fade-text {
            animation: fade-text 8s infinite;
        }
        @keyframes fade-text {
            0%, 20% { opacity: 1; content: "Finding suitable manufacturers..."; }
            25%, 45% { opacity: 1; content: "Checking product availability..."; }
            50%, 70% { opacity: 1; content: "Matching your project with companies..."; }
            75%, 95% { opacity: 1; content: "Preparing your results..."; }
            100% { opacity: 1; content: "Finding suitable manufacturers..."; }
        }
        
        /* Wireframe drawing animation simulation */
        .wireframe-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: dash 3s linear forwards infinite;
        }
        @keyframes dash {
            to { stroke-dashoffset: 0; }
        }
    </style>

<body class="bg-surface-container-low min-h-screen flex items-center justify-center m-0 p-0 overflow-hidden font-body-md text-on-surface">
<main class="relative w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop flex flex-col items-center justify-center z-10">
<!-- Architectural Animation Area -->
<div class="relative w-64 h-64 md:w-96 md:h-96 mb-unit-xl flex items-center justify-center">
<!-- Ambient glow behind animation -->
<div class="absolute inset-0 bg-primary opacity-5 rounded-full blur-3xl"></div>
<!-- Pulsing Rings -->
<div class="absolute w-48 h-48 md:w-64 md:h-64 border border-primary-fixed-dim rounded-full pulse-ring"></div>
<div class="absolute w-48 h-48 md:w-64 md:h-64 border border-primary-fixed-dim rounded-full pulse-ring" style="animation-delay: 1s;"></div>
<!-- SVG Wireframe Representation (Simulating IMAGE_10 pergola style) -->
<svg class="relative z-10 w-full h-full text-primary" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 200 200">
<!-- Base structure -->
<path class="wireframe-path" d="M40 160 L160 160"></path>
<path class="wireframe-path" d="M60 160 L60 80" style="animation-delay: 0.2s;"></path>
<path class="wireframe-path" d="M140 160 L140 80" style="animation-delay: 0.3s;"></path>
<!-- Roof structure (Pergola style) -->
<path class="wireframe-path" d="M40 80 L160 80" style="animation-delay: 0.5s;"></path>
<path class="wireframe-path" d="M50 70 L150 70" style="animation-delay: 0.6s;"></path>
<path class="wireframe-path" d="M60 60 L140 60" style="animation-delay: 0.7s;"></path>
<!-- Cross beams -->
<path class="wireframe-path" d="M70 80 L70 60" style="animation-delay: 0.8s;"></path>
<path class="wireframe-path" d="M100 80 L100 60" style="animation-delay: 0.9s;"></path>
<path class="wireframe-path" d="M130 80 L130 60" style="animation-delay: 1.0s;"></path>
<!-- Perspective lines -->
<path class="wireframe-path" d="M60 160 L80 140" stroke-opacity="0.3" style="animation-delay: 1.2s;"></path>
<path class="wireframe-path" d="M140 160 L120 140" stroke-opacity="0.3" style="animation-delay: 1.3s;"></path>
<path class="wireframe-path" d="M80 140 L120 140" stroke-opacity="0.3" style="animation-delay: 1.4s;"></path>
</svg>
</div>
<!-- Typography Cluster -->
<div class="text-center space-y-unit-md max-w-2xl">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface">
                Finding the perfect match for your project...
            </h1>
<div class="h-8 flex items-center justify-center">
<!-- Dynamic text container managed by JS -->
<p class="font-body-lg text-body-lg text-on-surface-variant transition-opacity duration-500" id="loading-subtext">
                    Finding suitable manufacturers...
                </p>
</div>
<!-- Progress Line -->
<div class="w-48 md:w-64 h-px bg-surface-variant mx-auto mt-unit-lg relative overflow-hidden">
<div class="absolute top-0 left-0 h-full bg-primary w-1/3 animate-[slide_2s_ease-in-out_infinite]"></div>
</div>
</div>
</main>
<!-- Decorative background elements (architectural blueprint vibe) -->
<div class="fixed inset-0 pointer-events-none z-0 opacity-10">
<!-- Subtle grid -->
<div class="absolute inset-0" style="background-image: linear-gradient(to right, var(--tw-colors-outline-variant) 1px, transparent 1px), linear-gradient(to bottom, var(--tw-colors-outline-variant) 1px, transparent 1px); background-size: 64px 64px;"></div>
<!-- Corner markers -->
<div class="absolute top-8 left-8 w-4 h-4 border-t border-l border-on-surface"></div>
<div class="absolute top-8 right-8 w-4 h-4 border-t border-r border-on-surface"></div>
<div class="absolute bottom-8 left-8 w-4 h-4 border-b border-l border-on-surface"></div>
<div class="absolute bottom-8 right-8 w-4 h-4 border-b border-r border-on-surface"></div>
</div>
<style>
        @keyframes slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(300%); }
        }
    </style>
<script>
        // Simple JS to handle text rotation smoothly
        const strings = [
            "Finding suitable manufacturers...",
            "Checking product availability...",
            "Matching your project with companies...",
            "Preparing your results..."
        ];
        
        let currentIndex = 0;
        const textElement = document.getElementById('loading-subtext');
        
        setInterval(() => {
            // Fade out
            textElement.style.opacity = '0';
            
            setTimeout(() => {
                // Change text and fade back in
                currentIndex = (currentIndex + 1) % strings.length;
                textElement.textContent = strings[currentIndex];
                textElement.style.opacity = '1';
            }, 500); // Wait for fade out to complete
            
        }, 3000); // Change text every 3 seconds
    </script>
