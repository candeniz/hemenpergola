<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        .input-premium {
            background-color: theme('colors.surface-container-lowest');
            border: 1px solid theme('colors.outline-variant');
            border-radius: theme('borderRadius.DEFAULT');
            padding: 0 16px;
            height: 48px;
            width: 100%;
            transition: all 0.2s ease-in-out;
            font-family: theme('fontFamily.body-md');
            font-size: 16px;
            color: theme('colors.on-surface');
        }
        
        .input-premium:focus {
            outline: none;
            border-color: theme('colors.primary');
            box-shadow: 0 0 0 2px rgba(6, 78, 59, 0.1);
        }

        .checkbox-premium {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 1px solid theme('colors.outline');
            border-radius: theme('borderRadius.DEFAULT');
            background-color: theme('colors.surface-container-lowest');
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .checkbox-premium:checked {
            background-color: theme('colors.primary');
            border-color: theme('colors.primary');
        }

        .checkbox-premium:checked::after {
            content: '';
            position: absolute;
            left: 6px;
            top: 2px;
            width: 6px;
            height: 12px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .btn-primary {
            background-color: theme('colors.primary-container');
            color: theme('colors.on-primary');
            border-radius: theme('borderRadius.DEFAULT');
            height: 48px;
            padding: 0 theme('spacing.unit-lg');
            font-family: theme('fontFamily.label-caps');
            font-size: 12px;
            line-height: 16px;
            letter-spacing: 0.1em;
            font-weight: 700;
            text-transform: uppercase;
            width: 100%;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }
        
        .btn-social {
            background-color: transparent;
            color: theme('colors.tertiary');
            border: 1px solid theme('colors.outline-variant');
            border-radius: theme('borderRadius.DEFAULT');
            height: 48px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: theme('fontFamily.label-md');
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s;
            cursor: pointer;
        }

            border-color: theme('colors.outline');
            background-color: theme('colors.surface-container-low');
