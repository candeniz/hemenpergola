# The workspace members. The web app deliberately STAYS the root package rather than
# moving under packages/ — every path in nine documents, the CI file, the reference-dir
# machinery and three years of muscle memory says 'src/', and repotting the plant to make
# room for a second pot risks the plant for the pot's sake (ADR-030 adds mobile BESIDE the
# web, not around it). 'mobile' is the Expo app; the root is implicitly a member.
packages:
  - mobile

# pnpm 11 reads settings from here, not from the "pnpm" field in package.json.
# (`onlyBuiltDependencies` was removed in v11 and replaced by `allowBuilds`.)
#
# Dependency postinstall scripts are blocked by default. Only these are allowed:
#   sharp                   — image processing used by next/image at build and runtime
#   unrs-resolver           — native resolver behind eslint-config-next's import plugin
#   prisma, @prisma/engines — the query engine binary; Prisma cannot run without it
#   esbuild                 — tsx compiles the seed scripts through it
#
# Denied deliberately — all optional native accelerations with working fallbacks, and
# 19-security-and-kvkk.md §Dependencies says allow only what is needed:
#   @parcel/watcher                — faster file watching for Tailwind's dev watcher
#   @swc/core                      — Next ships its own SWC binary; this copy is transitive
#   cpu-features, ssh2, protobufjs — testcontainers' Docker transport
allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': true
  '@swc/core': false
  cpu-features: false
  esbuild: true
  prisma: true
  protobufjs: false
  sharp: true
  ssh2: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - jose@6.2.9
