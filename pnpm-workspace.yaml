# The workspace members. The web app deliberately STAYS the root package rather than
# moving under packages/ — every path in nine documents, the CI file, the reference-dir
# machinery and three years of muscle memory says 'src/', and repotting the plant to make
# room for a second pot risks the plant for the pot's sake (ADR-030 adds mobile BESIDE the
# web, not around it). 'mobile' is the Expo app; the root is implicitly a member.
packages:
  - mobile

# pnpm 11 reads settings from here, not from the "pnpm" field in package.json.
# (`onlyBuiltDependencies` was removed in v11 and replaced by `allowBuilds`.)
#
# Dependency postinstall scripts are blocked by default. Only these are allowed:
#   sharp                   — image processing used by next/image at build and runtime
#   unrs-resolver           — native resolver behind eslint-config-next's import plugin
#   prisma, @prisma/engines — the query engine binary; Prisma cannot run without it
#   esbuild                 — tsx compiles the seed scripts through it
#
# Denied deliberately — all optional native accelerations with working fallbacks, and
# 19-security-and-kvkk.md §Dependencies says allow only what is needed:
#   @parcel/watcher                — faster file watching for Tailwind's dev watcher
#   @swc/core                      — Next ships its own SWC binary; this copy is transitive
#   cpu-features, ssh2, protobufjs — testcontainers' Docker transport
allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': true
  '@swc/core': false
  cpu-features: false
  esbuild: true
  prisma: true
  protobufjs: false
  sharp: true
  ssh2: false
  unrs-resolver: true
# A native build may contain only ONE copy of a native module, and two copies is a link
# error at `gradlew` time rather than anything a JS test would notice (task 13.6b — the
# first preview build died on exactly that class of problem, one layer down).
#
# `expo-asset@57.0.15` asks for `expo-constants: ~57.0.15`, which the SDK-expected 57.0.16
# satisfies — pnpm simply resolved two instances rather than one. This pins the single copy.
# `expo-doctor`'s duplicate-native-module check is what fails if this ever drifts, and it
# runs in CI now.
overrides:
  expo-constants: 57.0.17

# NOTE (corrected in 13.6c): this list is INERT as things stand. `minimumReleaseAge` is not
# set here, there is no root `.npmrc`, the machine has no global one, and pnpm's own default
# is `0` — `pnpm config list` shows no such key. The previous comment claimed "pnpm 11
# refuses packages published within its minimum release age", which was wrong: nothing was
# refused. `pnpm install` appends to this list because the list exists, and keeps it in sync
# when it moves a package; the entries only start meaning something if someone sets
# `minimumReleaseAge`. A clean clone therefore resolves exactly as this one does.
#
# `jose` came first; the rest arrived when the mobile dependencies were aligned with Expo
# SDK 57 — 13.6b, and again in 14.5 as upstream published newer patches. Every one is a
# PATCH inside SDK 57, and `expo-doctor` in CI is what makes the drift visible at all.
minimumReleaseAgeExclude:
  - jose@6.2.9
  - '@expo/cli@57.0.20'
  - '@expo/env@2.4.3'
  - '@expo/fingerprint@0.20.11'
  - '@expo/metro-config@57.0.12'
  - expo-constants@57.0.16 || 57.0.17
  - expo-font@57.0.2 || 57.0.3
  - expo@57.0.18
